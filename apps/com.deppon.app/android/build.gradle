buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        def expoCameraMaven = file("$rootDir/../node_modules/expo-camera/android/maven")

        if (!expoCameraMaven.isDirectory()) {
            throw new GradleException(
                "expo-camera Android Maven repository is missing. Run pnpm install from the workspace root."
            )
        }

        maven {
            // expo-camera is direct because Gradle needs this repository while configuring the build.
            url expoCameraMaven
        }
    }
}
apply plugin: "com.facebook.react.rootproject"
